{% extends "admin/base_admin.html" %}

{% block title %}Editar Voo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm p-4">
            <h1 class="text-center mb-4 text-primary">Editar Voo</h1>
            <hr>

            <form action="{{ url_for('admin.edit_voo', voo_id=voo_id) }}" method="POST">

                <!-- Código do voo (somente leitura) -->
                <div class="mb-3">
                    <label class="form-label">Código:</label>
                    <p class="form-control-plaintext">
                        <strong>{{ voo.codigo }}</strong>
                    </p>
                </div>

                <!-- Origem -->
                <div class="mb-3">
                    <label for="origem" class="form-label">Origem:</label>
                    <input type="text" name="origem" id="origem" class="form-control" value="{{ voo.origem }}" required>
                </div>

                <!-- Destino -->
                <div class="mb-3">
                    <label for="destino" class="form-label">Destino:</label>
                    <input type="text" name="destino" id="destino" class="form-control" value="{{ voo.destino }}"
                        required>
                </div>

                <!-- Milhas -->
                <div class="mb-3">
                    <label for="milhas" class="form-label">Milhas:</label>
                    <input type="text" name="milhas" id="milhas" class="form-control" value="{{ voo.milhas }}" required>
                </div>

                <!-- Preço da passagem -->
                <div class="mb-3">
                    <label for="preco_passagem" class="form-label">Preço da Passagem:</label>
                    <input type="text" name="preco_passagem" id="preco_passagem" class="form-control"
                        value="{{ voo.preco_passagem }}" required>
                </div>

                <!-- Tipo da aeronave -->
                <div class="mb-3">
                    <label for="tipo_aeronave" class="form-label">Tipo da Aeronave:</label>
                    <input type="text" name="tipo_aeronave" id="tipo_aeronave" class="form-control"
                        value="{{ voo.tipo_aeronave }}" required>
                </div>

                <!-- Número de assentos -->
                <div class="mb-3">
                    <label for="num_assentos" class="form-label">Número de Assentos:</label>
                    <input type="text" name="num_assentos" id="num_assentos" class="form-control"
                        value="{{ voo.num_assentos }}" required>
                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('admin.pagina_voos') }}" class="btn btn-secondary">← Voltar</a>
                    <button type="submit" class="btn btn-success">Salvar Voo</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Inputmask JS -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Mascara de preço R$
        $("#preco_passagem").inputmask('decimal', {
            rightAlign: false,
            digits: 2,
            digitsOptional: false,
            prefix: 'R$ ',
            autoGroup: true,
            radixPoint: '.',
            removeMaskOnSubmit: true
        });

        // Mascara de milhas (números inteiros)
        $("#milhas, #num_assentos").inputmask('integer', {
            rightAlign: false,
            min: 0,
            removeMaskOnSubmit: true
        });
    });
</script>
{% endblock %}
