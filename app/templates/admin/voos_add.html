{% extends "admin/base_admin.html" %}

{% block title %}Adicionar Voo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm p-4">
            <h1 class="text-center mb-4 text-primary">Adicionar Voo</h1>
            <hr>

            <form method="POST">

                <!-- Código do voo (somente leitura) -->
                <div class="mb-3">
                    <label for="codigo" class="form-label">Código do Voo</label>
                    <input type="text" name="codigo" id="codigo" class="form-control bg-light text-muted"
                        value="{{ codigo }}" readonly>
                    <small class="text-muted">Código gerado automaticamente pelo sistema</small>
                </div>

                <!-- Origem -->
                <div class="mb-3">
                    <label for="origem" class="form-label">Origem:</label>
                    <input type="text" name="origem" id="origem" class="form-control" required>
                </div>

                <!-- Destino -->
                <div class="mb-3">
                    <label for="destino" class="form-label">Destino:</label>
                    <input type="text" name="destino" id="destino" class="form-control" required>
                </div>

                <!-- Milhas -->
                <div class="mb-3">
                    <label for="milhas" class="form-label">Milhas:</label>
                    <input type="text" name="milhas" id="milhas" class="form-control" required>
                </div>

                <!-- Preço da Passagem -->
                <div class="mb-3">
                    <label for="preco_passagem" class="form-label">Preço da Passagem:</label>
                    <input type="text" name="preco_passagem" id="preco_passagem" class="form-control" required>
                </div>

                <!-- Tipo da Aeronave -->
                <div class="mb-3">
                    <label for="tipo_aeronave" class="form-label">Tipo da Aeronave:</label>
                    <input type="text" name="tipo_aeronave" id="tipo_aeronave" class="form-control" required>
                </div>

                <!-- Número de Assentos -->
                <div class="mb-3">
                    <label for="num_assentos" class="form-label">Número de Assentos:</label>
                    <input type="text" name="num_assentos" id="num_assentos" class="form-control" required>
                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('admin.pagina_voos') }}" class="btn btn-secondary">← Voltar</a>
                    <button type="submit" class="btn btn-success">Salvar Voo</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Inputmask JS -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Preço da passagem com máscara de moeda
        $("#preco_passagem").inputmask('decimal', {
            rightAlign: false,
            digits: 2,
            digitsOptional: false,
            prefix: 'R$ ',
            autoGroup: true,
            groupSeparator: '.',
            radixPoint: ',',
            removeMaskOnSubmit: true
        });

        // Milhas e Número de Assentos como inteiros
        $("#milhas, #num_assentos").inputmask('integer', {
            rightAlign: false,
            min: 0,
            removeMaskOnSubmit: true
        });
    });
</script>
{% endblock %}
