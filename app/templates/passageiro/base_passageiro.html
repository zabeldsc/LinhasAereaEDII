<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Voos{% endblock %}</title>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }

        .navbar-brand img {
            height: 28px;
        }

        .nav-link {
            font-weight: 500;
        }

        .nav-link:hover {
            opacity: 0.85;
        }

        .nav-link.text-danger:hover {
            opacity: 0.8;
        }

        main {
            flex: 1 0 auto;
        }

        footer {
            background-color: #0d3b66;
            color: #fff;
            padding: 1rem 0;
        }

        footer a {
            color: #fff;
            text-decoration: none;
        }

        footer a:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('passageiro.dashboard') }}">
                <img src="{{ url_for('static', filename='img/logo-airflow.png') }}" alt="AirFlow">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('passageiro.dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('passageiro.consultar_voos') }}">Voos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="{{ url_for('user.logout') }}">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-fill">
        <div class="container py-4">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center">
        <div class="container">

            <!-- Logo -->
            <div class="mb-2">
                <img src="{{ url_for('static', filename='img/logo-airflow.png') }}" alt="AirFlow" height="26">
            </div>

            <!-- Slogan -->
            <div class="small opacity-75 mb-3">
                Conectando você ao seu próximo destino
            </div>

            <!-- GitHub -->
            <div class="mb-3">
                <a href="https://github.com/zabeldsc/LinhasAereaEDII" target="_blank"
                    class="text-light fs-4 text-decoration-none">
                    <i class="bi bi-github"></i>
                </a>
            </div>

            <hr class="border-light opacity-25 my-3">

            <!-- Copyright -->
            <div class="small opacity-75">
                &copy; {{ year }} AirFlow — Sistema de Gestão de Voos
            </div>

        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
