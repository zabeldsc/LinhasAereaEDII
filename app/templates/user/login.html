{% extends "user/base_user.html" %}

{% block title %}Login | AirFlow{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 72vh;">

    <div class="col-11 col-sm-8 col-md-6 col-lg-4">

        <div class="card border-0 shadow-sm rounded-4 p-4">

            <!-- Título -->
            <div class="text-center mb-4">
                <h1 class="fw-semibold mb-2 fs-3" style="color:#0d3b66;">
                    Bem-vindo(a)
                </h1>
                <p class="text-muted mb-0">
                    Acesse sua conta AirFlow
                </p>
            </div>

            {% if erro %}
            <div class="alert alert-danger text-center">
                {{ erro }}
            </div>
            {% endif %}

            <!-- Formulário -->
            <form action="/user/login" method="POST">

                <div class="mb-3">
                    <label for="email" class="form-label fw-medium">
                        E-mail
                    </label>
                    <input type="email" id="email" name="email"
                        class="form-control"
                        placeholder="seuemail@email.com"
                        style="padding: 0.55rem 0.75rem;"
                        required>
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label fw-medium">
                        Senha
                    </label>
                    <input type="password" id="senha" name="senha"
                        class="form-control"
                        placeholder="••••••••"
                        style="padding: 0.55rem 0.75rem;"
                        required>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit"
                        class="btn btn-primary fw-medium"
                        style="padding: 0.55rem;">
                        Entrar
                    </button>
                </div>

            </form>

            <!-- Links -->
            <div class="text-center small">
                <a href="/" class="text-decoration-none d-block mb-1">
                    ← Voltar à página inicial
                </a>
                <span class="text-muted">
                    Não tem conta?
                    <a href="/user/cadastro"
                        class="text-decoration-none fw-medium">
                        Cadastre-se
                    </a>
                </span>
            </div>

        </div>
    </div>
</div>
{% endblock %}
